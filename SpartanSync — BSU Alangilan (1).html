const A=x=>Array.isArray(x)?x:[];
function clean(p){
if(!p||typeof p!=='object'||!A(p.profiles).length)return null;
p.gear=A(p.gear).filter(g=>g&&g.id);p.tutors=A(p.tutors).filter(x=>x&&x.id);p.vault=A(p.vault).filter(v=>v&&v.id);p.threads=A(p.threads).filter(x=>x&&x.id&&A(x.ids).length===2);
p.profiles=p.profiles.filter(x=>x&&x.id);
p.gear.forEach(g=>{g.dur=Number(g.dur)||4;g.dueAt=Number(g.dueAt)||0});
p.tutors.forEach(x=>x.joined=A(x.joined));p.vault.forEach(v=>{v.up=A(v.up);v.saved=A(v.saved)});
p.threads.forEach(x=>{x.msgs=A(x.msgs);x.unread=x.unread&&typeof x.unread==='object'?x.unread:{}});
p.version=5;return p.profiles.length?p:null}

let UI={v:'dashboard',col:'All',st:'All',q:'',tid:null,modal:false,tab:'switch',reader:null,peer:false,form:null,reply:null,draft:'',rc:0};

const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>ls.set(KEY,JSON.stringify(S));

const $=id=>document.getElementById(id);
const val=id=>(($(id)||{}).value||'').trim();

function toast(m){const el=$('toast');el.textContent=m;el.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',2600)}
function applyTheme(){document.documentElement.dataset.theme=TH;ls.set(TK,TH)}
const safeUrl=u=>{try{const p=new URL(String(u||'').trim());return/^https?:$/.test(p.protocol)?p.toString():null}catch{return null}};
const P2=n=>String(n).padStart(2,'0');
function hms(d){const s=Math.floor(Math.abs(d)/1e3);return`${P2(Math.floor(s/3600))}:${P2(Math.floor(s%3600/60))}:${P2(s%60)}`}
function timer(due){const d=due-Date.now();return`<span class="mono ac ${d<=0?'od':''}" data-due="${Number(due)}">${d<=0?E(t('over'))+' +':''}${hms(d)}</span>`}
const initials=n=>String(n).split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase();
const hit=(...f)=>{const q=UI.q.trim().toLowerCase();return!q||f.some(x=>String(x||'').toLowerCase().includes(q))};
const progOpts=(c,sel)=>(PROG[c]||PROG.COE).map(([k,l])=>`<option value="${E(k)}" ${k===sel?'selected':''}>${E(l)}</option>`).join('');
const colOpts=sel=>COLS.map(c=>`<option ${c===sel?'selected':''}>${c}</option>`).join('');
const zoneOpts=()=>ZONES.map(z=>`<option>${E(z)}</option>`).join('');
const colBar=()=>`<div class="row">${['All',...COLS].map(c=>`<button class="btn ${UI.col===c?'pri':''}" data-act="col" data-id="${c}">${c}</button>`).join('')}</div>`;
const stCls=s=>s==='Available'||s==='Open'?'ok':s==='Pending'?'wn':'ac';

function dlBlob(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}

/* ---------- Threads ---------- */
function thread(peer,ctx){const u=me();if(!u||peer===u.id||!prof(peer))return null;
let th=S.threads.find(x=>x.ids.includes(u.id)&&x.ids.includes(peer));
if(!th){th={id:'c'+Date.now(),ctx:ctx||'Direct Campus Chat',ids:[u.id,peer],unread:{},msgs:[]};S.threads.unshift(th)}else if(ctx)th.ctx=ctx;return th}
function post(th,txt,re){const u=me(),o=th.ids.find(i=>i!==u.id);
th.msgs.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),sid:u.id,txt,ts:Date.now(),rx:{},re:re||null});
th.unread[o]=(th.unread[o]||0)+1}

settings(u){return`<div class="box"><h3 style="margin-bottom:12px">${E(t('ns'))}</h3><div class="g2">
<input class="in" id="s-name" value="${E(u.name)}" aria-label="Full Name" maxlength="60"><input class="in mono" id="s-sr" value="${E(u.sr)}" aria-label="SR-Code" maxlength="8">
<select class="in" id="s-col" aria-label="College">${colOpts(u.college)}</select><select class="in" id="s-prog" aria-label="Program">${progOpts(u.college,u.program)}</select>
<select class="in" id="s-yr" aria-label="Year">${YEARS.map(y=>`<option ${y===u.year?'selected':''}>${y}</option>`).join('')}</select><input class="in" id="s-help" value="${E(u.help||'')}" placeholder="Skills / subjects" maxlength="100"></div>
<textarea class="in" id="s-bio" rows="2" style="margin-top:12px" placeholder="${E(t('bio'))}" maxlength="200">${E(u.bio||'')}</textarea><div style="margin-top:12px"><button class="btn pri" data-act="setsave">${E(t('savep'))}</button></div></div>
<div class="box"><h3 style="margin-bottom:10px">${E(t('lang'))}</h3><div class="row">${LANGS.map(([c,l])=>`<button class="btn ${LANG===c?'pri':''}" data-act="lang" data-id="${c}">${l}</button>`).join('')}</div>
<h3 style="margin:18px 0 10px">${E(t('theme'))}</h3><div class="row"><button class="btn ${TH==='light'?'pri':''}" data-act="settheme" data-id="light">${E(t('light'))}</button><button class="btn ${TH==='dark'?'pri':''}" data-act="settheme" data-id="dark">${E(t('dark'))}</button></div></div>
<div class="box"><div class="row"><button class="btn" data-act="export">${E(t('exp'))}</button><label class="btn" tabindex="0">${E(t('imp'))}<input type="file" id="import-file" accept=".json,application/json" style="display:none"></label><button class="btn pri" data-act="reset">${E(t('reset'))}</button></div></div>`}};

function render(){
const u=me();document.documentElement.lang=LANG;document.documentElement.dataset.theme=TH;
const af=document.activeElement,fid=af&&af.id,fs=af&&af.selectionStart;
const unread=u?S.threads.filter(x=>x.ids.includes(u.id)).reduce((a,x)=>a+(x.unread[u.id]||0),0):0;
const pend=u?S.gear.filter(g=>g.ownerId===u.id&&g.st==='Pending').length:0;
const NAV=[['dashboard','nd',0],['gear','ng',pend],['tutors','nt',0],['vault','nv',0],['chat','nc',unread],['settings','ns',0]];
$('sidebar').innerHTML=`<div class="brand"><span class="mark">S</span><b>SpartanSync</b></div><div class="campus">BSU – The National Engineering University<br>Alangilan Campus<div class="mono" style="font-size:11px">COE · CAFAD · CICS · CET</div></div>
<div class="nav">${NAV.map(([id,k,c])=>`<button class="nb ${UI.v===id?'on':''}" data-act="nav" data-id="${id}"><span>${E(t(k))}</span>${c?`<span class="mono">${c}</span>`:''}</button>`).join('')}</div>
<div class="foot"><button class="btn" data-act="theme">${E(TH==='dark'?t('light'):t('dark'))}</button><button class="ubox" data-act="auth"><span class="av">${u?E(initials(u.name)):'BS'}</span><span><b style="display:block;font-size:13px">${u?E(u.name):'—'}</b><span class="mono sm mu">${u?E(u.sr+' · '+u.college+' · '+u.program):E(t('login'))}</span></span></button></div>`;
$('mnav').innerHTML=NAV.map(([id,k])=>`<button class="${UI.v===id?'on':''}" data-act="nav" data-id="${id}">${E(t(k))}</button>`).join('');
$('top').innerHTML=`<h1>${E(t(NAV.find(n=>n[0]===UI.v)[1]))}</h1><div class="top-meta sm mu">${u?`<span class="mono"><b>${E(u.college)}</b> · ${E(u.program)} · ${E(u.sr)}</span> · ${E(u.year)}`:''}</div>
<div class="row"><select class="btn" id="top-lang" aria-label="${E(t('lang'))}">${LANGS.map(([c,l])=>`<option value="${c}" ${c===LANG?'selected':''}>${c.toUpperCase()} · ${l}</option>`).join('')}</select><button class="btn" data-act="theme" aria-label="${E(t('theme'))}">◐</button><button class="btn pri" data-act="auth">${E(t('login'))}</button></div>`;
$('main').innerHTML=u?VIEW[UI.v](u):`<div class="box" style="max-width:520px;margin:40px auto;text-align:center"><h2>${E(t('gate'))}</h2><p class="mu">Batangas State University – The National Engineering University (Alangilan Campus)</p><button class="btn pri" data-act="auth">${E(t('login'))}</button></div>`;
renderModal();
const ms=$('msgs');if(ms)ms.scrollTop=ms.scrollHeight;
if(fid&&$(fid)&&/INPUT|TEXTAREA/.test($(fid).tagName)&&$(fid).type!=='file'){$(fid).focus();try{$(fid).setSelectionRange(fs,fs)}catch{}}}

function renderModal(){
const m=$('modal'),u=me();
if(UI.reader){const v=S.vault.find(x=>x.id===UI.reader);
if(v&&u){const ext=safeUrl(v.url);m.className='on';
m.innerHTML=`<div class="mc"><div class="row sb"><div><span class="mono sm mu">${E(v.college)} · ${E(v.code)} · ${E(v.type)}</span><h2>${E(v.title)}</h2></div><button class="btn" data-act="close">${E(t('close'))}</button></div>
<div id="ps" style="background:var(--bg);border:1px solid var(--bd);padding:16px;margin:16px 0"><pre class="mono" style="white-space:pre-wrap;margin:0;font-size:12px;line-height:1.7;overflow-wrap:anywhere">${E(v.body)}</pre>${ext?`<div class="cf"><a href="${E(ext)}" target="_blank" rel="noopener noreferrer" style="color:var(--ac);font-weight:600;font-size:12px">${E(ext)}</a></div>`:''}</div>
<div class="row sb"><div class="row"><button class="btn ${v.up.includes(u.id)?'pri':''}" data-act="up" data-id="${E(v.id)}">▲ ${v.up.length}</button><button class="btn ${v.saved.includes(u.id)?'pri':''}" data-act="bm" data-id="${E(v.id)}">${E(v.saved.includes(u.id)?t('saved'):t('save'))}</button></div>
<div class="row"><button class="btn" data-act="print">${E(t('print'))}</button><button class="btn pri" data-act="dl">${E(t('dl'))}</button></div></div></div>`;return}
UI.reader=null}
if(!UI.modal){m.className='';m.innerHTML='';return}
m.className='on';
m.innerHTML=`<div class="mc"><div class="row sb"><h2>${E(t('login'))}</h2><button class="btn" data-act="close">${E(t('close'))}</button></div>
<div class="row cf" style="margin:12px 0 14px;border-top:0;padding-top:0">${[['switch','1-Click Switch'],['signin','Sign In'],['reg','Register']].map(([k,l])=>`<button class="btn ${UI.tab===k?'pri':''}" data-act="atab" data-id="${k}">${l}</button>`).join('')}</div>
${UI.tab==='switch'?`<div class="dl" style="border:1px solid var(--bd);padding:0 12px">${S.profiles.map(p=>`<div class="row sb"><div><b>${E(p.name)}</b> <span class="mono ac">${E(p.college)}</span>${p.nat?` <span class="sm mu">· ${E(p.nat)}</span>`:''}<div class="mono sm mu">${E(p.sr)} · ${E(p.program)} · ${E(p.year)}</div></div>${u&&u.id===p.id?'<span class="ok">Active</span>':`<button class="btn" data-act="sw" data-id="${E(p.id)}">Switch</button>`}</div>`).join('')}</div>${u?`<div class="row sb" style="margin-top:12px"><button class="btn" data-act="logout">${E(t('logout'))}</button></div>`:''}`
:UI.tab==='signin'?`<div class="g2"><input class="in mono" id="li-sr" placeholder="SR-Code (e.g. 23-04192)" maxlength="8" autocomplete="username"><input class="in mono" id="li-pin" type="password" placeholder="PIN / Password" autocomplete="current-password"></div><p class="sm mu">Seeded accounts use PIN 1234.</p><button class="btn pri" data-act="signin">Sign In</button>`
:`<div class="g2"><input class="in" id="r-name" placeholder="Full Name" maxlength="60"><input class="in mono" id="r-sr" placeholder="SR-Code (XX-XXXXX)" maxlength="8"><input class="in mono" id="r-pin" type="password" placeholder="PIN / Password (4+ chars)" autocomplete="new-password"><select class="in" id="r-col" aria-label="College">${colOpts('COE')}</select><select class="in" id="r-prog" aria-label="Program">${progOpts('COE')}</select><select class="in" id="r-yr" aria-label="Year">${YEARS.map(y=>`<option>${y}</option>`).join('')}</select></div><div style="margin-top:12px"><button class="btn pri" data-act="reg">Create & Sign In</button></div>`}</div>`}

/* ---------- Actions ---------- */
const owns=(c,id)=>c.find(x=>x.id===id);
const ACTS={
nav(id){UI.v=id;UI.q='';UI.col='All';UI.st='All';UI.form=null;UI.peer=false;render();scrollTo(0,0)},
lang(id){if(!D[id])return;LANG=id;ls.set(LK,id);render()},
theme(){TH=TH==='dark'?'light':'dark';applyTheme();render()},
settheme(id){TH=id;applyTheme();render()},
atab(id){UI.tab=id;render()},auth(){UI.modal=true;render()},
close(){UI.modal=false;UI.reader=null;render()},
sw(id){setUser(id);UI.modal=false;UI.tid=null;toast('Switched to '+prof(id).name);render()},
logout(){setUser(null);UI.modal=false;toast('Logged out');render()},
reset(){if(Date.now()-UI.rc>4000){UI.rc=Date.now();return toast('Tap Reset again to confirm')}
UI.rc=0;S=seed();setUser(S.lastUser);UI.modal=false;UI.tid=null;save();toast('Campus data reset');render()},
export(){dlBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'spartansync-state.json');toast('Exported JSON')},
signin(){const f=S.profiles.find(p=>p.sr===val('li-sr')&&p.pin===val('li-pin'));if(!f)return toast('Invalid SR-Code or PIN');setUser(f.id);UI.modal=false;toast('Signed in as '+f.name);render()},
reg(){const name=val('r-name'),sr=val('r-sr'),pin=val('r-pin');
if(!name||!SRX.test(sr)||pin.length<4)return toast('Enter name, SR-Code (XX-XXXXX) and a 4+ character PIN');
if(S.profiles.some(p=>p.sr===sr))return toast('That SR-Code is already registered');
const p={id:'stu-'+Date.now(),name,sr,pin,college:val('r-col'),program:val('r-prog'),year:val('r-yr'),nat:'',bio:'',help:''};
S.profiles.unshift(p);setUser(p.id);UI.modal=false;toast('Welcome, '+name);render()},
setsave(){const u=me(),name=val('s-name'),sr=val('s-sr');if(!name||!SRX.test(sr))return toast('Enter a valid name and SR-Code (XX-XXXXX)');
if(S.profiles.some(p=>p.sr===sr&&p.id!==u.id))return toast('That SR-Code is already registered');
Object.assign(u,{name,sr,college:val('s-col'),program:val('s-prog'),year:val('s-yr'),help:val('s-help'),bio:val('s-bio')});save();toast('Profile saved');render()},
dgear(){UI.q=val('dash-q');UI.v='gear';UI.col='All';render()},dtutor(){UI.q=val('dash-q');UI.v='tutors';UI.col='All';render()},
col(id){UI.col=id;render()},st(id){UI.st=id;render()},
form(id){UI.form=UI.form===id?null:id;const f=$('form-'+id);if(f)f.style.display=UI.form===id?'block':'none'},
gsave(){const u=me(),name=val('gf-name'),dur=Number(val('gf-dur'));if(!name)return toast('Enter the item name');if(!(dur>=1&&dur<=72))return toast('Duration must be 1–72 hours');
S.gear.unshift({id:'g'+Date.now(),name,college:val('gf-col'),code:val('gf-code').toUpperCase(),urg:$('gf-urg').value,ownerId:u.id,borrowerId:null,zone:val('gf-zone'),cond:val('gf-cond')||'BSU ID check on handoff.',st:'Available',dur,dueAt:0});UI.form=null;save();toast('Gear listed');render()},
borrow(id){const u=me(),g=owns(S.gear,id);if(!g||g.st!=='Available'||g.ownerId===u.id)return;
g.st='Pending';g.borrowerId=u.id;const th=thread(g.ownerId,`${g.name} · ${g.zone}`);post(th,`Hi! I’d like to borrow “${g.name}” for ${g.dur}h at ${g.zone}.`);UI.tid=th.id;UI.v='chat';save();toast('Borrow requested — chat opened');render()},
approve(id){const u=me(),g=owns(S.gear,id);if(!g||g.ownerId!==u.id||g.st!=='Pending')return;
g.st='Borrowed';g.dueAt=Date.now()+g.dur*36e5;const th=thread(g.borrowerId,`${g.name} · ${g.zone}`);if(th)post(th,`Approved! Meet at ${g.zone}. Please return within ${g.dur}h.`);save();toast('Approved — timer started');render()},
decline(id){const u=me(),g=owns(S.gear,id);if(!g||g.ownerId!==u.id)return;const th=thread(g.borrowerId,`${g.name} · ${g.zone}`);if(th)post(th,`Sorry, I can’t lend “${g.name}” right now.`);g.st='Available';g.borrowerId=null;g.dueAt=0;save();toast('Request declined');render()},
ret(id){const u=me(),g=owns(S.gear,id);if(!g||g.ownerId!==u.id)return;const th=thread(g.borrowerId,`${g.name} · ${g.zone}`);if(th)post(th,`Marked as returned: “${g.name}”. Thank you!`);g.st='Available';g.borrowerId=null;g.dueAt=0;save();toast('Marked returned');render()},
gdel(id){const g=owns(S.gear,id);if(!g||g.ownerId!==UID||g.st!=='Available')return;S.gear=S.gear.filter(x=>x.id!==id);save();toast('Listing deleted');render()},
tsave(){const u=me(),code=val('tf-code').toUpperCase(),subj=val('tf-subj');if(!code||!subj)return toast('Enter the subject code and topic');
S.tutors.unshift({id:'t'+Date.now(),kind:$('tf-kind').value,college:val('tf-col'),code,subj,desc:val('tf-desc')||subj,authorId:u.id,sched:val('tf-sched')||'Flexible',zone:val('tf-zone'),st:'Open',joined:[]});UI.form=null;save();toast('Published');render()},
help(id){const u=me(),x=owns(S.tutors,id);if(!x||x.authorId===u.id||x.joined.includes(u.id))return;
if(x.kind!=='Group Study'&&x.st!=='Open')return toast('Already matched');
x.st='Matched';x.joined.push(u.id);const th=thread(x.authorId,`${x.code} · ${x.zone}`);post(th,`Hi! I can help / join for ${x.code}: ${x.subj}.`);UI.tid=th.id;UI.v='chat';save();toast('Matched — chat opened');render()},
vsave(){const u=me(),code=val('vf-code').toUpperCase(),title=val('vf-title'),sum=val('vf-sum'),body=val('vf-body'),url=val('vf-url');
if(!code||!title||!sum||!body)return toast('Fill in code, title, summary and content');if(url&&!safeUrl(url))return toast('Link must start with http:// or https://');
S.vault.unshift({id:'v'+Date.now(),college:val('vf-col'),code,type:$('vf-type').value,title,authorId:u.id,sum,body,url:url||'',up:[u.id],saved:[]});UI.form=null;save();toast('Uploaded');render()},
read(id){if(owns(S.vault,id)){UI.reader=id;render()}},print(){window.print()},
dl(){const v=owns(S.vault,UI.reader);if(!v)return;dlBlob(new Blob([`${v.title}\n${v.college} · ${v.code} · ${v.type}\n${'='.repeat(44)}\n\n${v.body}\n`],{type:'text/plain;charset=utf-8'}),`${v.code.replace(/\s+/g,'')}_${v.title.replace(/[^\w]+/g,'_').slice(0,32)}.txt`);toast('Downloaded .txt')},
up(id){const v=owns(S.vault,id);if(!v)return;const i=v.up.indexOf(UID);i>=0?v.up.splice(i,1):v.up.push(UID);save();render()},
bm(id){const v=owns(S.vault,id);if(!v)return;const i=v.saved.indexOf(UID);i>=0?v.saved.splice(i,1):v.saved.push(UID);save();render()},
peer(){UI.peer=!UI.peer;render()},
newth(id){const th=thread(id,'Direct Campus Chat');if(th){UI.tid=th.id;UI.peer=false;save();render()}},
th(id){UI.tid=id;UI.reply=null;UI.draft='';render()},
chip(id){const th=owns(S.threads,UI.tid);if(!th)return;post(th,id);save();render()},
send(){const th=owns(S.threads,UI.tid),txt=($('chat-in')||{}).value;if(!th||!txt||!txt.trim())return;
const r=UI.reply!=null?th.msgs[UI.reply]:null;post(th,txt.trim(),r?{n:r.sid===UID?'You':(prof(r.sid)||{}).name||'Peer',t:String(r.txt).slice(0,80)}:null);UI.draft='';UI.reply=null;save();render();const i=$('chat-in');if(i)i.focus()},
rp(id){UI.reply=Number(id);render();const i=$('chat-in');if(i)i.focus()},rpx(){UI.reply=null;render()},
rx(id,b){const th=owns(S.threads,UI.tid),m=th&&th.msgs[Number(id)];if(!m)return;const em=b.dataset.em;
if(!m.rx||typeof m.rx!=='object'||Array.isArray(m.rx))m.rx={};const a=A(m.rx[em]),i=a.indexOf(UID);i>=0?a.splice(i,1):a.push(UID);m.rx[em]=a;save();render()}};

document.addEventListener('click',ev=>{
if(ev.target.id==='modal'){ACTS.close();return}
const b=ev.target.closest('[data-act]');if(!b)return;const f=ACTS[b.dataset.act];if(f)f(b.dataset.id,b)});
document.addEventListener('input',ev=>{const id=ev.target.id;
if(id==='srch'){UI.q=ev.target.value;const r=$('results');if(r&&me())r.innerHTML=UI.v==='gear'?gearList():UI.v==='tutors'?tutorList():vaultList()}
else if(id==='chat-in')UI.draft=ev.target.value});
document.addEventListener('keydown',ev=>{
if(ev.key==='Enter'&&ev.target.id==='chat-in'&&!ev.isComposing){ev.preventDefault();ACTS.send()}
else if(ev.key==='Escape'&&(UI.modal||UI.reader))ACTS.close()});
document.addEventListener('change',ev=>{const el=ev.target;
if(el.id==='top-lang')ACTS.lang(el.value);
else if(el.id==='r-col'||el.id==='s-col'){const p=$(el.id==='r-col'?'r-prog':'s-prog');if(p)p.innerHTML=progOpts(el.value)}
else if(el.id==='import-file'&&el.files[0]){const rd=new FileReader();rd.onload=()=>{try{const c=clean(JSON.parse(rd.result));if(!c)throw 0;S=c;if(!prof(UID))setUser(S.lastUser&&prof(S.lastUser)?S.lastUser:S.profiles[0].id);save();toast('Imported backup');render()}catch{toast('Invalid JSON backup')}};rd.readAsText(el.files[0]);el.value=''}});

/* Cross-tab sync: shared campus data, per-tab login session */
window.addEventListener('storage',ev=>{
if(ev.key===KEY&&ev.newValue){try{const c=clean(JSON.parse(ev.newValue));if(c){S=c;if(UID&&!prof(UID))UID=null;render()}}catch{}}
else if(ev.key===TK&&ev.newValue){TH=ev.newValue;render()}
else if(ev.key===LK&&D[ev.newValue]){LANG=ev.newValue;render()}});

/* Live countdown ticker */
setInterval(()=>document.querySelectorAll('[data-due]').forEach(el=>{
const d=Number(el.dataset.due)-Date.now(),od=d<=0;el.textContent=(od?t('over')+' +':'')+hms(d);el.classList.toggle('od',od)}),1000);

if(UID&&!prof(UID))UID=null;
applyTheme();render();
</script>
</body>
</html>
